appId: com.huaxia.tripcommandcenter
name: V7 iOS native app shell smoke
tags:
  - v7
  - smoke
  - ios
env:
  V7_FIXTURE_SCENARIO_ID: approved_trip
  V7_FIXTURE_TRIP_ID: trip_v7_beijing_family
  EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:8787
---
- launchApp:
    clearState: true
    stopApp: true
    arguments:
      V7_FIXTURE_SCENARIO_ID: approved_trip
      V7_FIXTURE_TRIP_ID: trip_v7_beijing_family
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: 华夏旅行指挥中心
    timeout: 120000
- assertVisible: Beijing 5-Day Command Center Test Trip
- assertVisible: 下一步
- assertVisible: Confirm hotel beside a subway station
- assertVisible: 首页 · 现在该做什么？ · Home
- assertVisible: 时间线 · 我在旅行哪一步？ · Timeline
- assertVisible: 任务 · 哪些任务现在要处理？ · Tasks
- assertVisible: 文件 · 我需要什么凭证？ · Documents
- assertVisible: 设置 · 这趟旅行该如何运行？ · Settings
- assertNotVisible: Unhandled JS Exception
- assertNotVisible: Something went wrong
- assertNotVisible: Network unavailable. Please check your connection.
- takeScreenshot: v7-ios-native-app-shell
