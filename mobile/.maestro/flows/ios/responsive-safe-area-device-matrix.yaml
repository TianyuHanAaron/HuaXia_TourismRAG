appId: com.huaxia.tripcommandcenter
name: V7 iOS responsive safe-area device matrix
tags:
  - v7
  - responsive
  - safe-area
  - ios
env:
  V7_FIXTURE_SCENARIO_ID: responsive_safe_area_device_matrix
  V7_FIXTURE_TRIP_ID: trip_v7_responsive_safe_area
  V7_FIXTURE_PATH: .maestro/fixtures/native-responsive-safe-area-device-matrix.json
  EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:8787
---
- launchApp:
    clearState: true
    stopApp: true
    arguments:
      V7_FIXTURE_SCENARIO_ID: responsive_safe_area_device_matrix
      V7_FIXTURE_TRIP_ID: trip_v7_responsive_safe_area
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: HuaXia
    timeout: 120000
- assertNotVisible: Unhandled JS Exception
- assertNotVisible: Something went wrong
- assertNotVisible: Network unavailable. Please check your connection.
- assertVisible: HuaXia
- assertVisible: Northern Xinjiang
- openLink: huaxia://trips/trip_v7_responsive_safe_area/(tabs)/tasks
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: Open
    optional: true
- assertVisible: 现在需要处理什么？
- assertVisible: Confirm the long cross-city transfer route
- assertVisible: 打开已准备路线
- takeScreenshot: v7-ios-responsive-safe-area-tasks
