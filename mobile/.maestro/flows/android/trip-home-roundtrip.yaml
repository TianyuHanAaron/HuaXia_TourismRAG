appId: com.huaxia.tripcommandcenter
name: V7 Android Trip Home native roundtrip
tags:
  - v7
  - trip-home
  - android
env:
  V7_FIXTURE_SCENARIO_ID: approved_trip
  V7_FIXTURE_TRIP_ID: trip_v7_beijing_family
  V7_FIXTURE_PATH: .maestro/fixtures/native-trip-home-roundtrip.json
  EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:8787
---
- launchApp:
    clearState: true
    stopApp: true
    arguments:
      V7_FIXTURE_SCENARIO_ID: approved_trip
      V7_FIXTURE_TRIP_ID: trip_v7_beijing_family
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: Beijing 5-Day Command Center Test Trip
    timeout: 120000
- assertVisible: 华夏旅行指挥中心
- assertVisible: 下一步
- assertVisible: Confirm hotel beside a subway station
- assertVisible: 查看阻塞原因
- assertNotVisible: Unhandled JS Exception
- assertNotVisible: Something went wrong
- assertNotVisible: Network unavailable. Please check your connection.
- openLink: huaxia://trips/trip_v7_beijing_family/(tabs)/timeline
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: Open
    optional: true
- assertVisible: 旅行时间线
- assertVisible: 阶段轨道
- openLink: huaxia://trips/trip_v7_beijing_family/(tabs)/tasks
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: Open
    optional: true
- assertVisible: 现在需要处理什么？
- scrollUntilVisible:
    element:
      text: Book Palace Museum morning entry
    direction: DOWN
    timeout: 20000
- assertVisible: Book Palace Museum morning entry
- scrollUntilVisible:
    element:
      text: Save ID copies before ticket pickup
    direction: DOWN
    timeout: 20000
- assertVisible: Save ID copies before ticket pickup
- openLink: huaxia://trips/trip_v7_beijing_family/(tabs)/documents
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: Open
    optional: true
- assertVisible: 文件保险箱
- assertVisible: 添加文件元数据
- openLink: huaxia://trips/trip_v7_beijing_family/(tabs)/settings
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: Open
    optional: true
- assertVisible: 偏好、隐私与账户
- assertVisible: 旅行默认值
- openLink: huaxia://trips/trip_v7_beijing_family/(tabs)
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: Open
    optional: true
- assertVisible: Beijing 5-Day Command Center Test Trip
- assertVisible: Confirm hotel beside a subway station
- assertVisible: 查看阻塞原因
- takeScreenshot: v7-android-trip-home-roundtrip
