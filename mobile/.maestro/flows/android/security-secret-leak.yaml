appId: com.huaxia.tripcommandcenter
name: V7 Android security and secret leak artifacts
tags:
  - v7
  - security
  - secret-leak
  - android
env:
  V7_FIXTURE_SCENARIO_ID: security_secret_leak_release_gate
  V7_FIXTURE_TRIP_ID: trip_v7_responsive_safe_area
  V7_FIXTURE_PATH: .maestro/fixtures/native-security-secret-leak.json
  EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:8787
---
- launchApp:
    clearState: true
    stopApp: true
    arguments:
      V7_FIXTURE_SCENARIO_ID: security_secret_leak_release_gate
      V7_FIXTURE_TRIP_ID: trip_v7_responsive_safe_area
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: HuaXia
    timeout: 120000
- assertVisible: HuaXia
- assertNotVisible: sk-
- assertNotVisible: RAW_LLM_PROMPT
- tapOn: 文件 · 哪些凭证要用？
- assertVisible: 文件保险箱
- assertVisible: 默认不进提示词
- assertNotVisible: hf_
- assertNotVisible: PASSPORT_SCAN_CONTENT
- takeScreenshot: v7-android-security-document-vault
- openLink: huaxia://trips/trip_v7_responsive_safe_area/(tabs)/tasks
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: Open
    optional: true
- assertVisible: 现在需要处理什么？
- tapOn: 打开已准备路线
- assertVisible: Where will I go if I tap this?
- assertVisible: 准备好的去向
- assertNotVisible: postgres://
- assertNotVisible: DASHSCOPE_API_KEY
- takeScreenshot: v7-android-security-provider-sheet
