  - android
env:
  V7_FIXTURE_SCENARIO_ID: accessibility_keyboard_screen_reader
  V7_FIXTURE_TRIP_ID: trip_v7_accessibility_beijing
  V7_FIXTURE_PATH: .maestro/fixtures/native-accessibility-keyboard-screen-reader.json
