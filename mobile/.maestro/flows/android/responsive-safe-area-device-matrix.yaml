appId: com.huaxia.tripcommandcenter
name: V7 Android responsive safe-area device matrix
tags:
  - v7
  - responsive
  - safe-area
  - android
env:
  V7_FIXTURE_SCENARIO_ID: responsive_safe_area_device_matrix
  V7_FIXTURE_TRIP_ID: trip_v7_responsive_safe_area
  V7_FIXTURE_PATH: .maestro/fixtures/native-responsive-safe-area-device-matrix.json
  EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:8787
---
- launchApp:
    clearState: true
    stopApp: true
    arguments:
      V7_FIXTURE_SCENARIO_ID: responsive_safe_area_device_matrix
      V7_FIXTURE_TRIP_ID: trip_v7_responsive_safe_area
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: HuaXia
    timeout: 120000
- assertNotVisible: Unhandled JS Exception
- assertNotVisible: Something went wrong
- assertNotVisible: Network unavailable. Please check your connection.
- openLink: huaxia://trips/trip_v7_responsive_safe_area/(tabs)/timeline
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: Open
    optional: true
- assertVisible: 旅行时间线
- assertVisible: Northern Xinjiang transfer
- openLink: huaxia://trips/trip_v7_responsive_safe_area/(tabs)/tasks
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: Open
    optional: true
- assertVisible: Open prepared route
- takeScreenshot: v7-android-responsive-safe-area-matrix
